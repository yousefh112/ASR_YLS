# Mission stack parameters.
#
# Everything that depends on the arena, the deadline or the robot lives here and
# nowhere else, so nothing has to be edited in a hurry on Friday.
#
# Node names must match the ones the mission process actually creates, because
# `mission_control.py` hosts several nodes in one executable and ROS matches
# parameters by node name.  Keys must also match the names declared in code:
# a key nothing declares is silently ignored, which looks exactly like a
# setting that had no effect.
#
# `mission.launch.py` rewrites SIX keys through RewrittenYaml: use_sim_time,
# mission_duration, output_directory, optical_correction, scan_rotation and
# stop_after_tags.  The substitution is UNCONDITIONAL, so each launch argument's
# default overrides whatever is written here - editing this file alone changes
# nothing for those six.  test/test_launch_defaults.py fails if any of them
# disagrees with its launch default.  Do not delete them.

/**:
  ros__parameters:
    use_sim_time: false

mission_control:
  ros__parameters:
    # ---------------- deadline ----------------
    # 240 s: the announced window for the real run.  Change it here AND in
    # mission.launch.py's default together - the launch default wins - or pass
    # `mission_duration:=<seconds>` for a one-off.
    mission_duration: 240.0
    startup_timeout: 90.0         # give SLAM, TF and Nav2 this long to come up
    loop_period: 0.4               # state machine tick

    # ---------------- return budget ----------------
    # Re-estimated from a path the Nav2 planner actually produced, so these only
    # shape the margin around it.  Returning on time is +150 against -30 for a
    # minute late, so the margin is deliberately generous.
    # Effective m/s on the way home.  Measured, not guessed: in the harness run
    # the robot was sent home from 6.75 m out and arrived 36.4 s later, i.e.
    # 0.19 m/s over an already-mapped route with no sweeps and no frontier
    # stops.  At 0.15 with a 1.3 safety factor the model charged 8.67 s/m
    # against a realised 5.26 s/m - a 2.2x reserve, and the reference run gave
    # back 84 s of its 600 s window because of it, standing at the start doing
    # nothing while six tags went unfound.
    #
    # 0.18 still charges 7.22 s/m, 37% more than measured, and the margin grows
    # with path length rather than shrinking, so the estimate stays conservative
    # at every distance.  Break-even needs the return to degrade to 0.125 m/s.
    # That is what the 1.3 factor and the 20 s fixed reserve are for, so neither
    # of those moves.
    return_speed: 0.18
    return_safety_factor: 1.3
    return_fixed_margin: 15.0      # cancel the goal, final approach, export
    budget_update_period: 3.0

    # ---------------- arrival ----------------
    # The rules say within 50 cm.  Aiming at 0.35 leaves room for the SLAM drift
    # between what TF believes and where the robot physically is; accepting at
    # exactly 0.50 would put the run on the boundary of a 150-point swing.
    home_tolerance: 0.35
    return_retries: 3

    # A false loop closure does not degrade the pose estimate, it teleports it,
    # and everything expressed in the map frame - including the recorded start
    # pose - moves with it.  A change in map->odom this large inside one budget
    # period is a graph re-optimisation, not the robot driving; legitimate
    # corrections arrive in centimetres.  After one, the return aims at the
    # start pose as odometry remembers it, which drifts but cannot jump.
    odom_frame: 'odom'
    map_jump_threshold: 0.35
    map_jump_threshold_rad: 0.26
    trust_odom_after_jump: true
    # Stop trying this far past the deadline.  25, not 45.
    #
    # The bands are +150 on time, 0 at 30 s late, -30 at 60, -70 at 120. Once
    # the deadline has passed the return award is gone either way, so the only
    # thing still at stake is not sliding into the negative band - and the
    # deliverables, which are not written until the robot stops trying.
    # 45 s left it driving well inside the 0-to--30 band with the export
    # waiting on it; 25 gives up while the penalty is still zero and writes the
    # 200 points of files. It was sized for a 600 s window, where 45 s was 7%
    # of the run; here it is 19%.
    return_grace: 25.0

    # Stop exploring the moment this many unique tags are in hand and drive
    # home, however much time is left.  0 disables it, which is the right
    # setting when the tag count is unknown - leaving early with tags unfound
    # costs 50 points each.  Set it only if the organisers announce the number.
    stop_after_tags: 12

    # How many tags the arena holds.  The organisers announced twelve for the
    # real run, which is what makes stop_after_tags above safe to use at all:
    # ending early is only correct when the true count is known.  It also lets
    # the coverage report name which ids are still missing rather than only
    # counting what was found.  Set to 0 if the count is ever unannounced.
    expected_tags: 12

    # ---------------- exploration ----------------
    # How long one frontier goal may run, scaled by how far away it is:
    # distance / return_speed * factor, clamped.  A flat timeout is either
    # generous for a 2 m hop or mean for a 7 m one, and a run contains both.
    # goal_speed is NOT return_speed, though it was until the return budget was
    # retuned.  Sharing one key meant raising the return speed shortened every
    # goal timeout by the same ratio, and a timed-out goal costs a wasted trip
    # plus a frontier banned for frontier_failure_ttl.  Held at the old 0.15 so
    # goal patience is unchanged by that retune.
    goal_speed: 0.15
    goal_timeout_min: 12.0
    goal_timeout_max: 30.0
    goal_timeout_factor: 2.0

    # An empty frontier list has to persist this long, and then survive this
    # many full turns on the spot, before the arena counts as explored.
    #
    # 6 s, down from 25.  The 25 s was set while the frontier search could not
    # see the edge of the map and went silent in open space, so a long wait was
    # the only thing standing between a transient and a wrongly-ended mission.
    # With that fixed an empty list is a trustworthy signal, and 6 s still spans
    # three map updates.  One recovery turn instead of three: if a full turn and
    # a costmap wipe do not produce a frontier, two more will not either, and
    # the arena is not going to explore itself while the robot pirouettes.
    #
    # Measured: spinning consumed 48% of a 516 s run.
    no_frontier_timeout: 3.0
    recovery_spins: 1

    # One turn before exploring starts, for the CAMERA: a tag may be visible
    # from the start pose and this is the only look the robot gets at it from
    # here.
    #
    # It does NOT seed the map, which is what this comment used to claim.  A
    # stationary turn feeds slam_toolbox nothing at all.  The startup speckle
    # that motivated it - unknown gaps riddling the free space, every gap read
    # as a frontier, the lot clustered onto the robot's own position, and
    # "exploration complete" three seconds in - is a min_pass_through effect:
    # from a standstill the mapper has processed exactly one scan, and Karto
    # needs MORE than min_pass_through rays through a cell.  On the real LDS-02
    # (~200 beams) that ended all three arena rehearsals at t+19 s with 1 m2
    # known.  Fixed by min_pass_through: 0 in param_slam_toolbox.yaml - 12.3 m2
    # known from a standstill on nuc11 - not by spinning, which adds no scans.
    initial_spin: 5.30
    spin_time_allowance: 25.0

    # Frontier ranking.  See frontier_policy.FrontierPolicy for what each does.
    min_frontier_distance: 0.35
    # Stop driving at a frontier once the detector stops reporting one there:
    # the robot's own LiDAR filled it in on the way, and standing on the exact
    # centroid afterwards is pure cost.
    #
    # 12 ticks at a 0.4 s loop is about five seconds, which spans at least two
    # map updates.  A cluster's representative point can jump most of a metre
    # when the map updates, so a shorter window mistakes that jump for the
    # frontier having been consumed and cancels a goal the robot was still
    # driving to.
    consumed_checks: 8
    blacklist_radius: 0.5
    frontier_max_attempts: 2       # drive failures before a permanent ban
    # Planner refusals are counted apart from drive failures and their ban
    # lapses: early on, the costmap between the robot and a frontier is mostly
    # unknown and "no path" means "not yet", not "never".
    frontier_unreachable_attempts: 3
    frontier_unreachable_ttl: 25.0
    # A frontier the robot drove at and failed to reach is set aside for much
    # longer - but not forever.  A run that permanently banned its last
    # frontier went home with the arena five percent explored, which costs far
    # more than the forty seconds a retry wastes.
    frontier_failure_ttl: 45.0
    # ...and if every remaining frontier is banned, drop the whole blacklist
    # rather than declare the arena explored.  Twice, then believe it.
    blacklist_clears: 2
    turn_penalty: 0.6              # bias against spinning to face a candidate
    hysteresis: 1.35               # keep the current goal unless clearly beaten
    use_planner_costs: true        # rank the shortlist by real path length
    candidates_to_plan: 5

    # Do not start a long trip across the arena on a thin time budget.
    horizon_slack_threshold: 60.0
    min_horizon: 1.5

    # ---------------- patrol ----------------
    # What the robot does when the frontier search is exhausted but the clock is
    # not.  It used to go home and stand there: the reference run finished with
    # 84 s of its window unused and six of eleven tags never found.
    #
    # Finishing the map is not finishing the hunt.  The LiDAR sees 360 degrees,
    # so a wall gets mapped from whatever heading the robot happened to have;
    # the camera sees about 55, so that same wall is only photographed if the
    # robot was pointing at it.  Patrol drives to known free space the camera
    # has not swept from and sweeps there.  See patrol.py.
    #
    # A candidate closer than patrol_spacing to somewhere already swept is not
    # worth the trip - at this spacing the sweeps overlap
    # comfortably without re-photographing the same corner.
    patrol_spacing: 1.4
    patrol_clearance: 0.25         # obstacle-free disc a patrol point needs
    # Metres of detour accepted per metre of extra novelty.  Nearest-first
    # re-sweeps one corner; farthest-first crosses the arena for a single look.
    patrol_travel_weight: 0.35
    # Give up on patrolling after this many unreachable patrol points, rather
    # than spending the endgame failing to reach the same place.
    patrol_max_failures: 4
    # When every candidate is within patrol_spacing of somewhere already swept,
    # the spacing is halved and the question asked again, down to this floor,
    # instead of declaring the hunt over.  A closer look is worth less than a
    # new one and much more than parking at the start with time on the clock:
    # a 60-70 degree camera still photographs different walls from 1 m away.
    # Below this the robot is effectively standing everywhere it can already.
    patrol_min_spacing: 0.35

    # Rotate on arrival at each frontier so the forward-facing camera sweeps
    # the area instead of only the direction of travel.  The camera sees about
    # 60-70 degrees: without this, a tag on a wall the robot drove past is never
    # detected.  A sweep costs roughly ten seconds and a tag is worth 50
    # points, so it pays - but only while there is slack, because being a
    # minute late costs 180.  Set to 0.0 to turn sweeping off entirely.
    # 5.30, not 6.28.  The last FOV-worth of a full turn re-photographs what the
    # first frame already covered, so 2*pi - FOV is a complete camera sweep.
    #
    # The two cameras differ: Gazebo's is 59 degrees (1.03 rad), giving 5.25,
    # and the robot's RealSense at 1280x720 is 69 (1.20 rad), giving 5.08.
    # 5.30 is a shade over the larger of the two, so it is a full sweep in both
    # with a little overlap rather than a gap - erring the safe way, since a
    # missed slice of arena costs a tag and the extra 0.05 rad costs 0.03 s.
    #
    # This is a camera number, not a SLAM one.  A stationary turn contributes
    # nothing whatsoever to the map - slam_toolbox's shouldProcessScan gates on
    # translation alone, and a 360 degree LiDAR learns nothing by spinning - so
    # there is no mapping reason to prefer a full circle.  See the long note on
    # behaviour_server.max_rotational_vel in param_nav2.yaml.
    scan_rotation: 5.30
    # Was 90 s, which skipped the sweep for the whole endgame.  A sweep now
    # costs about 3 s (5.30 rad at 1.9 rad/s) rather than 7, and spin_in_place
    # already aborts the moment must_return() flips, so this gate is a backstop
    # against starting one that cannot finish, not a time-management policy.
    scan_rotation_min_slack: 10.0

    # ---------------- frames and output ----------------
    map_frame: 'map'
    # base_footprint is the TurtleBot3 convention and what slam_toolbox
    # publishes against.  CLAUDE.md defect 7.
    base_frame: 'base_footprint'
    output_directory: '~/asr_mission_output'

tag_manager:
  ros__parameters:
    tag_family: 'tag36h11'
    map_frame: 'map'

    # There is no camera frame setting: the node reads the parent of each tag
    # frame from TF, which is by definition the frame apriltag_ros stamped the
    # image with.  Works unchanged in Gazebo and on either camera.
    #
    # CLAUDE.md defect 2.  apriltag_ros always solves the tag pose in the
    # optical convention (z forward, y down).  A real driver stamps an optical
    # frame to match; Gazebo's camera plugin falls back to the body-aligned
    # link name, and the tag then comes out with the right ID at a rotated
    # position.  'auto' applies the correction when the parent frame's name
    # does not contain "optical", which is right in both environments.
    # Force it with 'on' or 'off' if a driver ever names its frames oddly.
    optical_correction: 'auto'

    poll_period: 0.2
    # apriltag_ros stops broadcasting when a tag leaves view but tf2 keeps
    # serving the last transform, so anything older than this is a leftover in
    # the buffer rather than a live sighting.
    # 20.0, not 1.0.  This is the ONLY cross-machine clock comparison in the tag
    # path, and the mission runs on the laptop while apriltag stamps the tag
    # transform with the NUC's clock.  At 1.0 s, a laptop running a second ahead
    # of the robot - two machines free-running from their RTCs on an arena wifi
    # with no NTP - discards EVERY detection here, silently, and the run scores
    # zero tags with nothing in the log to say why.
    #
    # Raising it is safe because this gate is not what detects staleness.  The
    # dedup on the line below keys on the transform's own stamp, and when a tag
    # leaves view apriltag stops broadcasting while tf2 keeps serving the last
    # transform - unchanged stamp, so the dedup suppresses it.  The age test
    # only ever fires on a first sighting after a gap.
    #
    # 20 s is bounded by the TF buffer, which is 30 s (tag_manager.py:119): past
    # that the map lookup fails anyway, and that failure IS counted.  So 20 s of
    # tolerance with 10 s of headroom, against a gate that was costing every tag
    # for no benefit it was actually providing.
    max_detection_age: 20.0

    # Quality gates.  Tag position error grows with range, but a tag seen only
    # once at 5 m is still +50 points while the entire accuracy category is
    # worth 30 in total - so the gate is set by what can be decoded reliably,
    # not by what can be decoded precisely.  Observations are weighted 1/r^2,
    # so one close sighting later outweighs several distant ones and the
    # estimate converges on the good measurement.
    max_detection_range: 6.5
    gate_distance: 0.75            # reject an observation this far off the mean
    gate_patience: 5               # ...until this many in a row say otherwise
    publish_markers: true
