# AprilTag detector settings for the challenge.
#
# Our copy, not turtlebot3_perception's.  The vendored launch file loads its own
# config with `yaml_to_dict` and passes it straight to the composable node, so
# there is no override hook and no way to change a detector setting from a
# launch argument.  Rather than edit a vendored package, asr_summer_school ships
# this file and its own apriltag.launch.py, which is otherwise identical.
#
# The one substantive change is `decimate`.
#
# Why decimate matters more than anything else here
# --------------------------------------------------
# Whether a tag decodes is decided by how many pixels span it, and `decimate`
# downsamples the image before quad detection - so it divides that number
# directly. With our camera.launch.py profile of 1280x720 (HFOV 69 deg) a
# 0.16 m tag spans (0.16/r)/1.204 * 1280 = 170/r pixels at full resolution:
#
#     range      decimate 1.0     decimate 2.0
#     2 m         85 px            43 px
#     4 m         43 px            21 px
#     6 m         28 px            14 px
#     8 m         21 px            11 px
#
# A 36h11 tag is ten cells across counting the border and needs on the order of
# twenty pixels to decode at all. So decimate 1.0 reaches about 8 m and
# decimate 2.0 about 4 m - and because a camera sweep covers a disc, that is
# four times the ground per stop.
#
# This is the largest single lever on tag count in the whole stack. The robot
# is already at the burger's 0.22 m/s ceiling (measured), so it cannot cover
# more ground by driving harder; it can only see more of the ground it covers.
#
# The vendored config ships 2.0, and against the vendored 640x480 profile that
# put the decode horizon near 2.5 m while the mission was gating detections at
# 5 m - admitting detections the detector could never produce, silently.
#
# The cost is CPU, which is why threads is 2 and why camera.launch.py drops the
# frame rate to 15: a sweep takes ~3 s, so 15 fps still puts ~45 frames on the
# arena per stop. Range decides whether a tag CAN be decoded; frame rate only
# decides how many chances there are at one already in reach.
#
# If the NUC cannot keep up, cut the camera frame rate again before raising
# this. Check with `ros2 topic hz /camera/detections` while sweeping at a tag.
camera:
  apriltag:
    ros__parameters:
      image_transport: raw
      family: 36h11
      # Physical edge length of the printed tag, in metres.  If the arena's
      # tags are not 16 cm this is wrong and every tag position is wrong with
      # it, proportionally - measure one before the run.
      size: 0.16
      profile: false

      max_hamming: 0
      detector:
        threads: 2
        decimate: 1.0
        blur: 0.0
        refine: true
        sharpening: 0.25
        debug: false
