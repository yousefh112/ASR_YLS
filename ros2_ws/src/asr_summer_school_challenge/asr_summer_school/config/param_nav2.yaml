controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # 0.5 rad, not 0.25.  Every goal in this mission is either a frontier,
      # where the heading is a by-product of the direction of travel and nobody
      # cares about it, or the start pose, which is scored on position alone.
      # Insisting on 14 degrees spends several seconds turning on the spot at
      # the end of every single goal, for no points.
      yaw_goal_tolerance: 0.5

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.22
      max_vel_y: 0.0
      # Governs turning while FOLLOWING a path - the swing onto a new heading at
      # the start of each goal, and RotateToGoal at the end.  Distinct from the
      # sweep, which is behaviour_server's Spin (see max_rotational_vel).
      # Raising this alone would be a silent no-op: velocity_smoother clamps the
      # controller's angular output to its own max_velocity, so that has to move
      # with it.  1.5 rather than the sweep's 1.9 because this rate is used while
      # translating, where an aggressive yaw rate makes DWB's trajectories less
      # stable in a corridor.
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      # 0.5, not the reference's 0.2.  The robot PC runs SLAM, the camera, the
      # AprilTag detector and the whole Nav2 stack at once, and under that load
      # a 0.2 s tolerance produces "Unable to transform robot pose into global
      # plan's frame" and the controller aborts a goal it could have finished.
      # 0.5 s of staleness is 11 cm at the burger's top speed.
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      # See controller_server: this machine is loaded enough that the default
      # 0.3 s drops scans and pose lookups.
      transform_tolerance: 0.5
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.105   # TurtleBot3 Burger
      # One layer per sensor.  obstacle_layer and voxel_layer were both
      # subscribed to /scan, so every ray was marked and raytraced twice for
      # identical results.  The local costmap keeps the voxel layer (the
      # nav2_bringup default for this robot); the global costmap keeps the
      # plain obstacle layer.
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 1.0 m of inflation in a 1 m corridor leaves no zero-cost cell
        # anywhere between the walls, so the gradient the controller steers
        # down is flat and the robot either refuses to enter or wanders.
        # 0.28 m keeps a ~0.45 m clear channel down the middle of a 1 m gap.
        inflation_radius: 0.28
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # /scan_filtered, the same topic slam_toolbox reads, so the map and
          # the costmaps can never disagree about where the obstacles are.
          #
          # It matters here for a second reason.  The LDS-02 reports `inf` for
          # a ray that hits nothing, and nav2 drops non-finite readings unless
          # inf_is_valid is set - so on raw /scan the costmap gets no clearing
          # ray at all in any open direction, and an obstacle seen once is
          # never cleared once the robot has moved past it.  The range filter
          # in param_slam_toolbox.yaml turns those into a finite 3.45 m, which
          # is beyond obstacle_max_range (nothing is marked) and inside
          # raytrace_max_range (the ray clears), which is exactly right.
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # /scan_filtered, the same topic slam_toolbox reads, so the map and
          # the costmaps can never disagree about where the obstacles are.
          #
          # It matters here for a second reason.  The LDS-02 reports `inf` for
          # a ray that hits nothing, and nav2 drops non-finite readings unless
          # inf_is_valid is set - so on raw /scan the costmap gets no clearing
          # ray at all in any open direction, and an obstacle seen once is
          # never cleared once the robot has moved past it.  The range filter
          # in param_slam_toolbox.yaml turns those into a finite 3.45 m, which
          # is beyond obstacle_max_range (nothing is marked) and inside
          # raytrace_max_range (the ray clears), which is exactly right.
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.105   # TurtleBot3 Burger
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # /scan_filtered, the same topic slam_toolbox reads, so the map and
          # the costmaps can never disagree about where the obstacles are.
          #
          # It matters here for a second reason.  The LDS-02 reports `inf` for
          # a ray that hits nothing, and nav2 drops non-finite readings unless
          # inf_is_valid is set - so on raw /scan the costmap gets no clearing
          # ray at all in any open direction, and an obstacle seen once is
          # never cleared once the robot has moved past it.  The range filter
          # in param_slam_toolbox.yaml turns those into a finite 3.45 m, which
          # is beyond obstacle_max_range (nothing is marked) and inside
          # raytrace_max_range (the ray clears), which is exactly right.
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          # /scan_filtered, the same topic slam_toolbox reads, so the map and
          # the costmaps can never disagree about where the obstacles are.
          #
          # It matters here for a second reason.  The LDS-02 reports `inf` for
          # a ray that hits nothing, and nav2 drops non-finite readings unless
          # inf_is_valid is set - so on raw /scan the costmap gets no clearing
          # ray at all in any open direction, and an obstacle seen once is
          # never cleared once the robot has moved past it.  The range filter
          # in param_slam_toolbox.yaml turns those into a finite 3.45 m, which
          # is beyond obstacle_max_range (nothing is marked) and inside
          # raytrace_max_range (the ray clears), which is exactly right.
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Matches the local costmap.  Two walls 1 m apart each inflating 0.55 m
        # overlap in the middle, so the planner sees no free lane at all.
        inflation_radius: 0.28
      always_send_full_costmap: True
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# Both of these are managed by lifecycle_manager_navigation (see
# nav2_bringup/launch/navigation_launch.py) but had no section in this file at
# all, which meant they silently kept use_sim_time false under Gazebo and
# velocity_smoother clamped cmd_vel to a generic robot's limits.
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # TurtleBot3 Burger limits, not the reference robot's 0.26/1.0.
    # The angular term must track FollowPath.max_vel_theta: this smoother sits in
    # the cmd_vel path to the wheels, so whichever of the two is lower is the one
    # that actually applies.  Raising one without the other silently wastes the
    # change - the same shape as defect 9.
    max_velocity: [0.22, 0.0, 1.5]
    min_velocity: [-0.22, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Humble calls this the behavior_server; under the Foxy name "recoveries_server"
# the whole block is ignored and the robot has no recovery behaviours.
# Verify after launch:  ros2 param get /behavior_server behavior_plugins
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    # Humble's nav2_behaviors reads "transform_tolerance"; the Foxy-era
    # "transform_timeout" spelling is undeclared and silently ignored, leaving
    # the behaviours on the 0.1 s default anyway - but only by luck.
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    # This is the ONLY clamp on the camera sweep: mission_control.spin_in_place
    # drives Nav2's Spin behaviour, which reads its rate from here and never
    # goes through the controller or the velocity smoother.
    #
    # It used to be 1.0, on the belief that a slow full turn fed slam_toolbox
    # about thirty pose-graph nodes and that spinning faster would cost
    # localisation.  That belief is false.  slam_toolbox's shouldProcessScan
    # (slam_toolbox_common.cpp, Humble 2.6.10) gates on TRANSLATION only:
    #
    #     const double dist2 = last_pose.SquaredDistance(pose);
    #     if (dist2 < 0.8 * min_dist2 || scan_ctr < 5) { return false; }
    #
    # There is no heading test.  A robot turning on the spot has dist2 ~ 0, so
    # every scan taken during a stationary spin is rejected before Karto sees
    # it, and our minimum_travel_heading never gets a say.  Which is obvious in
    # hindsight: the LDS-02 is a 360 degree sensor, so rotating it in place adds
    # no range information at all.  A stationary turn contributes exactly zero
    # pose-graph nodes and zero occupancy-grid cells.
    #
    # The sweep is therefore a pure CAMERA action - it exists to point a 60
    # degree RGB field of view at tags - and its speed is bounded by motion
    # blur, not by SLAM.  1.9 rad/s is two thirds of the burger's 2.84 ceiling
    # and halves every turn in the run.
    #
    # If tags start going missing on the real robot, blur is the reason and this
    # is the number to lower - check it with `ros2 topic hz /camera/detections`
    # while sweeping in front of a tag before touching anything else.
    max_rotational_vel: 1.9
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200